<style>
:root{
  color-scheme:dark;
  /* colori Piano pensione, ruoli e misure dal design system Wallet */
  --background:#0e0e0d; --foreground:#ece8df; --muted-foreground:#b3aea4; --subtle-foreground:#9a958b;
  --card:rgba(255,255,255,.06); --secondary:rgba(255,255,255,.09); --strong:rgba(255,255,255,.12);
  --border:rgba(255,255,255,.08); --divider:rgba(255,255,255,.07); --divider-row:rgba(255,255,255,.05);
  --popover:rgba(26,25,24,.94); --overlay:rgba(0,0,0,.5);
  --primary:#ece8df; --primary-foreground:#0e0e0d;
  --brand:#f05a28; --brand-foreground:#1b0d06; --brand-soft:rgba(240,90,40,.16);
  --pos:#8fd4a8; --pos-soft:rgba(143,212,168,.14); --ivory:#d6cfbd; --warning:#e3a64b; --warning-soft:rgba(227,166,75,.14); --destructive:#ff7a6b; --destructive-soft:rgba(255,122,107,.13);
  --ambient-strong:rgba(240,90,40,.09); --ambient-soft:rgba(240,90,40,.045);
  --hair:.75px; --shadow-glass:inset 0 -1px 2px rgba(255,255,255,.06); --shadow-popover:0 24px 60px rgba(0,0,0,.5);
  --r-md:8px; --r:10px; --r-xl:14px; --r-2xl:18px; --r-3xl:22px; --r-card:26px; --pill:999px;
  --font:Geist,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  /* alias usati dal codice dei grafici */
  --accent:var(--pos); --accent-soft:var(--pos-soft); --muted:var(--subtle-foreground); --line:rgba(255,255,255,.07); --blue:var(--ivory); --ink:var(--foreground); --warn:var(--warning); --neg:var(--destructive);
}
*{box-sizing:border-box}
html{background:var(--background)}
body{margin:0;min-height:100vh;color:var(--foreground);font-family:var(--font);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(900px 620px at 96% -12%,var(--ambient-strong),transparent 70%),radial-gradient(760px 620px at -6% 70%,var(--ambient-soft),transparent 70%),var(--background);background-attachment:fixed}
select,input,textarea,button{font:inherit;color:inherit}
button{cursor:pointer;transition:background-color .2s,color .2s,transform .15s cubic-bezier(.2,.8,.2,1)}
button:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}button:active{transform:none}}
:focus-visible{outline:2px solid rgba(240,90,40,.6);outline-offset:2px}
::selection{background:rgba(240,90,40,.28);color:var(--foreground)}
input{caret-color:var(--brand)}
*{scrollbar-width:thin;scrollbar-color:var(--strong) transparent}
.ic{width:20px;height:20px;fill:currentColor;flex:none}.ic.sm{width:16px;height:16px}

/* shell telefono */
.content{max-width:720px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top)) 0 18px}
.top h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;letter-spacing:-.015em}
.iconbtn{width:40px;height:40px;border-radius:var(--pill);display:grid;place-items:center;color:var(--foreground);background:var(--card);border:var(--hair) solid var(--border);box-shadow:var(--shadow-glass)}
.side .brand,.side .fundbox,.sidestatus,.side .sb-new{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;isolation:isolate;display:flex;align-items:center;padding:4px 6px max(24px,env(safe-area-inset-bottom))}
.tabs::before{content:"";position:absolute;left:0;right:0;top:-24px;bottom:0;z-index:-1;pointer-events:none;
  background:linear-gradient(to top,rgba(14,14,13,.72) 55%,rgba(14,14,13,.55));backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  -webkit-mask-image:linear-gradient(to top,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to top,#000 calc(100% - 24px),transparent)}
.tabs button{flex:1;min-width:0;min-height:56px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:10px;line-height:1;font-weight:600;color:var(--subtle-foreground)}
.tabs button.on{color:var(--foreground)}
.tabs .ic{width:24px;height:24px}
.tabs .ic.f{display:none}.tabs button.on .ic.f{display:block}.tabs button.on .ic.r{display:none}
.tabs .tab-plus{flex:none;width:56px;height:56px;min-height:0;margin:0 8px;border-radius:28px;display:grid;place-items:center;background:var(--primary);color:var(--primary-foreground);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.tabs .tab-plus .ic{width:24px;height:24px}
.only-side{display:none!important}
.fab{display:none!important}
.mfund{margin-bottom:16px}

/* saldo */
.hero{padding:4px 2px 28px}
.hl{font-size:13px;color:var(--subtle-foreground)}
.balance{display:flex;align-items:baseline;font-weight:600;letter-spacing:-.04em;line-height:1;margin:8px 0 12px}
.balance .int{font-size:56px}
.balance .dec{font-size:26px;letter-spacing:-.02em;color:var(--muted-foreground)}
.hs{margin:0;font-size:15px;color:var(--muted-foreground);max-width:44ch}
.hs b{color:var(--foreground);font-weight:600}
.delta{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:var(--pill);font-size:12px;font-weight:600;background:var(--pos-soft);color:var(--pos);margin-right:6px;vertical-align:1px}
.delta.neg{background:var(--destructive-soft);color:var(--destructive)}
.hd{font-size:13px;color:var(--subtle-foreground);margin-top:10px}.warnt{color:var(--warning)}

/* card vetro e righe */
.ghead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--subtle-foreground);padding:0 4px 8px;margin-top:32px}
.ghead:first-child{margin-top:0}
.dash>div+div>.ghead:first-child{margin-top:32px}
.ghead b{font-weight:600;color:var(--muted-foreground)}
.group,.card,.kpi,.segtabs{background:var(--card);border:var(--hair) solid var(--border);box-shadow:var(--shadow-glass)}
.group{border-radius:var(--r-3xl);overflow:hidden}
.group+.group{margin-top:12px}
.card{border-radius:var(--r-3xl);padding:16px}
.card h2{font-size:17px;margin:0 0 12px;font-weight:600}
.gfoot{font-size:13px;color:var(--subtle-foreground);padding:0 4px;margin:10px 0 0;line-height:1.4;max-width:62ch}
.grow{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;width:100%;border:0;background:none;text-align:left;color:inherit}
.grow+.grow{border-top:var(--hair) solid var(--divider-row)}
.grow[role=button]{cursor:pointer;transition:background-color .2s}
.grow[role=button]:hover,.grow[role=button]:active{background:rgba(255,255,255,.04)}
.gicon{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;background:var(--secondary);color:var(--foreground)}
.gicon .ic{width:16px;height:16px}
.gicon.or{background:var(--pos-soft);color:var(--pos)}.gicon.am{background:var(--warning-soft);color:var(--warning)}.gicon.rd{background:var(--destructive-soft);color:var(--destructive)}
.gmain{flex:1;min-width:0}
.gt{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gs{font-size:13px;color:var(--subtle-foreground);line-height:1.35;overflow:hidden;text-overflow:ellipsis}
.gv{font-size:15px;font-weight:600;white-space:nowrap;text-align:right}
.gv small{display:block;font-size:12px;font-weight:600;margin-top:1px}
.gv.mut{color:var(--subtle-foreground)}.gv.am{color:var(--warning)}.gv.rd{color:var(--destructive)}.gv.or{color:var(--pos)}
.chev{width:14px;height:14px;color:var(--subtle-foreground);flex:none;margin-left:-4px}
.pos{color:var(--pos)} .neg{color:var(--destructive)}
.muted{color:var(--muted-foreground);font-size:13px}
.lead{margin:0 4px 16px;color:var(--muted-foreground);font-size:15px;max-width:60ch}
.empty{text-align:center;color:var(--muted-foreground);padding:34px 16px}.emptyic{color:var(--brand)}.emptyic .ic{width:36px;height:36px}

/* grafici, tabelle, kpi */
.chartbox{position:relative;height:210px}
table{width:100%;border-collapse:collapse}
th,td{padding:0 4px;height:44px;text-align:right;font-size:15px}
td{border-top:var(--hair) solid var(--divider-row)}
th{height:36px;font-size:12px;color:var(--subtle-foreground);font-weight:600}
td:last-child{font-weight:600}
th:first-child,td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.kpi{border-radius:var(--r-3xl);padding:16px}
.kpi .l{font-size:12px;font-weight:600;color:var(--subtle-foreground);margin-bottom:6px}
.kpi .v{font-size:22px;font-weight:600;letter-spacing:-.015em}
.kpi .s{font-size:13px;color:var(--muted-foreground);margin-top:6px;line-height:1.35}
.kpi.hero{grid-column:1/-1;border-radius:var(--r-card);padding:20px}
.kpi.hero .v{font-size:40px;letter-spacing:-.04em;line-height:1.05}
.bar{height:8px;border-radius:var(--pill);background:var(--secondary);overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--pos);border-radius:var(--pill)}

/* controlli: pill */
.segtabs{display:flex;padding:3px;border-radius:var(--pill);margin:0 0 20px;box-shadow:none}
.segtabs button{flex:1;height:34px;padding:0 12px;border:0;border-radius:var(--pill);background:none;color:var(--muted-foreground);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
.segtabs button.on{background:var(--primary);color:var(--primary-foreground)}
.segtabs em{font-style:normal;font-size:12px;font-weight:600;background:var(--warning);color:#1a1205;border-radius:var(--pill);min-width:18px;height:18px;line-height:18px;padding:0 5px}
.segtabs button.on em{background:var(--primary-foreground);color:var(--primary)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border:0;border-radius:var(--pill);font-size:14px;font-weight:600;white-space:nowrap;background:var(--primary);color:var(--primary-foreground)}
.btn.ghost{background:var(--card);color:var(--foreground);border:var(--hair) solid var(--border);box-shadow:var(--shadow-glass)}
.btn.danger{background:transparent;color:var(--destructive);border:var(--hair) solid var(--destructive)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.block{width:100%;height:44px}
.inline-cta{padding:12px 0 0}

/* moduli */
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--subtle-foreground);margin-bottom:14px;min-width:0}
label.f>span{margin:0 4px}
select,input,textarea{height:44px;width:100%;min-width:0;display:block;padding:0 16px;border-radius:var(--pill);background:var(--card);border:var(--hair) solid rgba(255,255,255,.08);box-shadow:var(--shadow-glass);-webkit-appearance:none;appearance:none;font-size:16px;font-weight:400;color:var(--foreground)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--subtle-foreground) 50%),linear-gradient(135deg,var(--subtle-foreground) 50%,transparent 50%);background-position:calc(100% - 21px) 19px,calc(100% - 16px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:38px}
input[type=date],input[type=month]{line-height:44px}
input::-webkit-date-and-time-value{text-align:left}
input:focus,select:focus{outline:none;border-color:rgba(240,90,40,.6)}
input::placeholder{color:var(--subtle-foreground)}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:none;border-radius:6px;-webkit-appearance:auto;appearance:auto;accent-color:var(--brand);background:none;border:0;box-shadow:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.grid2>*{min-width:0}
label.check{flex-direction:row;gap:12px;align-items:flex-start;color:var(--foreground);font-weight:400;font-size:14px;background:var(--warning-soft);padding:14px 16px;border-radius:var(--r-xl)}
.formnote{font-size:13px;color:var(--muted-foreground);margin:-4px 4px 14px;line-height:1.4}
.note{background:var(--warning-soft);color:var(--warning);border-radius:var(--r-xl);padding:12px 16px;font-size:14px;margin-bottom:12px}
.pick{background:var(--card);border:var(--hair) solid var(--border);border-radius:var(--r-xl);margin-bottom:14px;overflow:hidden}
.pickhead{display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 16px;font-size:12px;font-weight:600;color:var(--subtle-foreground)}
.pickhead b{color:var(--foreground);font-size:14px}
.pickrow{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;cursor:pointer;border-top:var(--hair) solid var(--divider-row);font-size:15px}
.pickrow span{flex:1}.pickrow b{font-weight:600}
.choices{display:grid;gap:8px}
.choices button{display:flex;align-items:center;gap:12px;min-height:60px;text-align:left;background:var(--card);border:var(--hair) solid var(--border);box-shadow:var(--shadow-glass);border-radius:var(--r-xl);padding:12px 16px}
.choices button:hover{background:var(--secondary)}
.choices b{display:block;font-size:15px;font-weight:600}.choices span{font-size:13px;color:var(--subtle-foreground)}

/* dialog e sheet */
dialog{border:var(--hair) solid var(--strong);padding:0;width:min(480px,100vw);max-width:100vw;max-height:92vh;background:var(--popover);color:var(--foreground);border-radius:var(--r-2xl);box-shadow:var(--shadow-popover);overflow:auto;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
dialog::backdrop{background:var(--overlay)}
dialog form{padding:20px 16px calc(16px + env(safe-area-inset-bottom));position:relative}
dialog h3{margin:0 48px 20px 4px;font-size:17px;font-weight:600}
.dclose{position:absolute;top:12px;right:12px;width:36px;height:36px}.dclose .ic{width:16px;height:16px}
dialog .grid2{grid-template-columns:1fr}
@media(min-width:520px){dialog .grid2{grid-template-columns:1fr 1fr}}
@media(max-width:599px){
  dialog{margin:auto 0 0;width:100vw;border-radius:var(--r-3xl) var(--r-3xl) 0 0;border-bottom:0}
  dialog form{padding-top:26px}
  dialog form::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--strong)}
  dialog[open]{animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
.actions{display:flex;gap:8px;margin-top:6px}
.actions .sp{display:none}
.actions .btn{flex:1;height:44px}.actions .btn.danger{flex:0 0 auto}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:6;transform:translateX(-50%);background:var(--primary);color:var(--primary-foreground);padding:0 16px;height:36px;line-height:36px;border-radius:var(--pill);font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

/* desktop: densità compatta, sidebar 240 */
@media(min-width:900px){
  body{font-size:14px}
  .app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
  .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:10px;padding:12px 10px;background:rgba(14,14,13,.4);border-right:var(--hair) solid var(--divider)}
  .side .brand{display:flex;gap:10px;align-items:center;height:44px;padding:0 6px}
  .side .logo{width:26px;height:26px;border-radius:var(--r-md);overflow:hidden;display:block}.side .logo svg{width:100%;height:100%;display:block}
  .side .bt{font-weight:600;font-size:14px}.side .brand .muted{font-size:12px;color:var(--subtle-foreground)}
  .side .fundbox{display:block}.side .fundbox select{height:32px;font-size:13px}
  .side .sb-new{display:flex;height:32px;font-size:13px;background:var(--brand);color:var(--brand-foreground)}
  .sidestatus{display:block;margin-top:auto;font-size:12px;color:var(--subtle-foreground);padding:0 10px}
  .tabs{position:static;flex-direction:column;align-items:stretch;gap:1px;padding:0;border:0;border-radius:0;background:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;height:32px;min-height:0;line-height:1.4;padding:0 10px;border-radius:var(--r);font-size:13px;font-weight:500;color:var(--muted-foreground)}
  .tabs button:hover{background:rgba(255,255,255,.08)}
  .tabs button.on{background:rgba(255,255,255,.08);color:var(--foreground);font-weight:600}
  .tabs .ic{width:16px;height:16px}
  .tabs .tab-plus{display:none}
  .tabs::before{display:none}
  .tabs .ic.f{display:none!important}.tabs button.on .ic.r{display:block!important}
  .only-side{display:flex!important}.only-mobile{display:none!important}
  .content{max-width:960px;padding:0 24px 48px;width:100%}
  .top{position:sticky;top:0;z-index:3;height:52px;padding:0;margin:0 -24px 24px;padding:0 24px;background:rgba(14,14,13,.55);border-bottom:var(--hair) solid var(--divider);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .top h1{font-size:17px}
  .mfund{display:none}
  .group,.card,.kpi{border-radius:var(--r-xl)}
  .kpi.hero{border-radius:var(--r-xl)}
  .grow{min-height:40px;padding:6px 16px}
  .gt,.gv{font-size:14px}.gs{font-size:12px}
  .btn{height:32px;font-size:13px;padding:0 14px}.btn.block{height:36px}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px;align-items:start}
  .ghead{margin-top:24px}
  .dash>div>.ghead:first-child,.dash>div+div>.ghead:first-child{margin-top:0}
  td{height:40px;font-size:14px}
}
</style>
</head>

<script>
(() => {
"use strict";
// ---------- state ----------
const DEFAULTS = {
  fondi: ["Amundi Seconda Pensione"], annoNascita: null, etaPensione: 67,
  rendimento: 3, inflazione: 2, crescita: 1.5, tfrMensile: null,
  personaleMensile: 0, aliquota: 35, limite: 5164.57
};
const S = { db:null, canWrite:true, mov:[], tfr:[], val:[], cfg:{...DEFAULTS}, loaded:{mov:false,tfr:false,val:false,cfg:false},
  view: "panoramica", sub: "versamenti", fund: "__all", charts:{} };
const $ = s => document.querySelector(s);
const view = $("#view");

// ---------- format ----------
const eur = new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",useGrouping:"always"});
const eur0 = new Intl.NumberFormat("it-IT",{style:"currency",currency:"EUR",maximumFractionDigits:0,useGrouping:"always"});
const pct = (x,d=2) => (x==null||!isFinite(x)) ? "—" : (x>=0?"+":"") + (x*100).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const fd = s => { if(!s) return "—"; const [y,m,d]=s.split("-"); return `${d}/${m}/${y}`; };
const MESI = ["Gennaio","Febbraio","Marzo","Aprile","Maggio","Giugno","Luglio","Agosto","Settembre","Ottobre","Novembre","Dicembre"];
const fc = s => { if(!s) return ""; const [y,m]=s.split("-"); return `${MESI[+m-1]} ${y}`; };
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = typeof v==="number"?v:parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; };
const sgn = x => x>=0?"pos":"neg";
const bal = v => { const t=eur.format(v), i=t.indexOf(","); return i<0?`<span class="int">${t}</span>`:`<span class="int">${t.slice(0,i)}</span><span class="dec">${t.slice(i)}</span>`; };
function toast(t){ const el=$("#toast"); el.textContent=t; el.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove("on"),2200); }

// ---------- data helpers ----------
// Due archivi distinti: TFR accumulato (righe di busta paga) e versamenti (soldi arrivati sul fondo, o spese)
const TIPI = {TFR:{l:"TFR",c:"tfr"}, Personale:{l:"Personale",c:"per"}, Datore:{l:"Datore",c:"dat"}, Spesa:{l:"Spesa",c:"spe"}};
const inFund = x => S.fund==="__all" || x.fondo===S.fund;
function movs(){ return S.mov.filter(inFund); }
function contrib(){ return movs().filter(m=>m.tipo!=="Spesa"); }
function spese(){ return movs().filter(m=>m.tipo==="Spesa"); }
function tfrs(){ return S.tfr.filter(inFund); }
function pendingTfr(fondo){ return S.tfr.filter(t=>!t.versamento && (fondo?t.fondo===fondo:inFund(t))); }
function vals(){ return S.val.filter(inFund).sort((a,b)=>a.data.localeCompare(b.data)); }
const sum = (a,k="importo") => a.reduce((s,x)=>s+num(x[k]),0);

function lastValuation(){
  const vs = vals(); if(!vs.length) return null;
  if(S.fund!=="__all") return {data:vs[vs.length-1].data, valore:vs[vs.length-1].valore};
  const byF = {}; vs.forEach(v=>byF[v.fondo]=v);
  const arr = Object.values(byF);
  return {data: arr.map(v=>v.data).sort().pop(), valore: arr.reduce((s,v)=>s+v.valore,0), parts:arr};
}
// versato sul fondo (esclude le spese) fino a una data
function accreditatoAl(date, fondo){
  return sum(contrib().filter(m=>m.data<=date && (!fondo||m.fondo===fondo)));
}
function speseAl(date, fondo){ return sum(spese().filter(m=>m.data<=date && (!fondo||m.fondo===fondo))); }

function xirr(flows){
  if(flows.length<2) return null;
  const t0 = new Date(flows[0].d).getTime();
  const yrs = flows.map(f => (new Date(f.d).getTime()-t0)/(365.25*864e5));
  if(Math.max(...yrs) < 0.08) return null;
  const f = r => flows.reduce((s,fl,i)=>s+fl.v/Math.pow(1+r,yrs[i]),0);
  let lo=-0.99, hi=10, flo=f(lo);
  if(flo*f(hi)>0) return null;
  for(let i=0;i<200;i++){ const mid=(lo+hi)/2, fm=f(mid); if(Math.abs(fm)<1e-7) return mid; if(flo*fm<0){hi=mid}else{lo=mid;flo=fm} }
  return (lo+hi)/2;
}
// Rendimento annuo al netto delle spese: flussi = versamenti, valore finale = estratto conto
function computeIRR(){
  const lv = lastValuation(); if(!lv) return null;
  const parts = lv.parts || [{fondo:null, data:lv.data}];
  const flows = [];
  parts.forEach(p=>contrib().filter(m=>(!p.fondo||m.fondo===p.fondo) && m.data<=p.data).forEach(m=>flows.push({d:m.data,v:-m.importo})));
  if(!flows.length) return null;
  flows.push({d:lv.data, v:lv.valore});
  flows.sort((a,b)=>a.d.localeCompare(b.d));
  return xirr(flows);
}
function avgTFR(){
  const t = tfrs().slice().sort((a,b)=>(b.competenza||b.data).localeCompare(a.competenza||a.data));
  const last = t.slice(0,6).map(m=>m.importo).sort((a,b)=>a-b);   // mediana: ignora la tredicesima
  return last.length ? last[Math.floor(last.length/2)] : 0;
}
const tfrLabel = t => t.competenza ? fc(t.competenza) : fd(t.data);

// ---------- db ----------
function setStatus(t){ $("#status").textContent = t; }
async function initDb(){
  let db=null;
  try{ db = await claude.use("db"); }catch(e){ db=null; }
  if(!db){ setStatus("Archivio non disponibile in questa vista"); render(); return; }
  S.db = db;
  try{ const u = await claude.use("user"); if(u && u.isOwner){ const o = await u.isOwner(); if(o===false) S.canWrite=false; } }catch(e){}
  const timer = setTimeout(()=>{ if(!Object.values(S.loaded).every(Boolean)) setStatus("Dati non ancora raggiungibili…"); },10000);
  const done = () => { if(Object.values(S.loaded).every(Boolean)){ clearTimeout(timer); setStatus(S.canWrite?"Salvato nel cloud":"Sola lettura"); } };
  const err = e => { clearTimeout(timer); setStatus("Errore archivio: "+(e&&e.code||"sconosciuto")); };
  db.collection("movimenti").onSnapshot(snap=>{
    S.mov = snap.docs.map(d=>({id:d.id,...d.data(), importo:num(d.data().importo)}));
    if(!snap.metadata.fromCache) S.loaded.mov=true; done(); render();
  }, err);
  db.collection("tfr").onSnapshot(snap=>{
    S.tfr = snap.docs.map(d=>({id:d.id,...d.data(), importo:num(d.data().importo)}));
    if(!snap.metadata.fromCache) S.loaded.tfr=true; done(); render();
  }, err);
  db.collection("valorizzazioni").onSnapshot(snap=>{
    S.val = snap.docs.map(d=>({id:d.id,...d.data(), valore:num(d.data().valore)}));
    if(!snap.metadata.fromCache) S.loaded.val=true; done(); render();
  }, err);
  db.doc("config/settings").onSnapshot(snap=>{
    S.cfg = {...DEFAULTS, ...(snap.exists?snap.data():{})};
    if(!snap.metadata.fromCache) S.loaded.cfg=true; done(); renderFunds(); render();
  }, err);
}
async function save(coll, id, data){
  if(!S.db) throw new Error("db");
  if(id) await S.db.collection(coll).doc(id).set(data); else await S.db.collection(coll).add(data);
}
async function del(coll,id){ await S.db.collection(coll).doc(id).delete(); }
let cfgPending=null, cfgTimer=null, cfgWriting=false;
function saveCfg(patch){
  S.cfg = {...S.cfg, ...patch};
  cfgPending = {...S.cfg};
  clearTimeout(cfgTimer);
  cfgTimer = setTimeout(flushCfg, 600);
}
async function flushCfg(){
  if(cfgWriting||!cfgPending||!S.db) return;
  cfgWriting=true; const body=cfgPending; cfgPending=null;
  try{ await S.db.doc("config/settings").set(body); }catch(e){ toast("Impostazioni non salvate"); }
  cfgWriting=false; if(cfgPending) flushCfg();
}
function guard(){ if(!S.db){ toast("Archivio non disponibile"); return false; } if(!S.canWrite){ toast("Sola lettura"); return false; } return true; }

    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="bCsv"><svg class="ic sm"><use href="#i-download-simple"/></svg>CSV</button><button class="btn ghost" id="bJson"><svg class="ic sm"><use href="#i-download-simple"/></svg>JSON</button></div></div>`;
  $("#bFund").onclick=()=>{ const v=$("#newFund").value.trim(); if(!v||!guard()) return; if((c.fondi||[]).includes(v)) return; saveCfg({fondi:[...(c.fondi||[]),v]}); renderFunds(); render(); };
  view.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{ if(!guard()) return; const f=c.fondi[+b.dataset.i];
    if(S.mov.some(m=>m.fondo===f)||S.tfr.some(m=>m.fondo===f)||S.val.some(v=>v.fondo===f)){ toast("Il fondo ha dei dati: spostali prima"); return; }
    saveCfg({fondi:c.fondi.filter((_,i)=>i!==+b.dataset.i)}); renderFunds(); render(); });
  $("#sAl").oninput=e=>saveCfg({aliquota:num(e.target.value)});
  $("#sLim").oninput=e=>saveCfg({limite:num(e.target.value)});
  $("#bCsv").onclick=exportCSV; $("#bJson").onclick=exportJSON;
}
};

function emptyState(){
  return `<div class="card"><div class="empty"><div class="emptyic"><svg class="ic"><use href="#i-plant"/></svg></div><p>Nessun dato ancora.</p>
  <p class="muted">Inizia dal TFR dell'ultima busta paga, poi aggiungi il valore dall'estratto conto.</p></div></div>`;
}
function yearTable(){
  const m = movs(), v = vals();
  const ys = [...new Set(m.map(x=>x.data.slice(0,4)).concat(v.map(x=>x.data.slice(0,4))))].sort().reverse();
  if(!ys.length) return `<div class="empty">—</div>`;
  return `<div class="tablewrap"><table><tr><th>Anno</th><th>TFR</th><th>Altri</th><th>Spese</th><th>Valore</th></tr>${ys.map(y=>{
    const my = m.filter(x=>x.data.startsWith(y)), vy=v.filter(x=>x.data.startsWith(y));
    const lastV = vy.length? (S.fund==="__all" ? Object.values(vy.reduce((o,x)=>(o[x.fondo]=x,o),{})).reduce((s,x)=>s+x.valore,0) : vy[vy.length-1].valore) : null;
    const spY = sum(my.filter(x=>x.tipo==="Spesa"));
    return `<tr><td>${y}</td><td>${eur0.format(sum(my.filter(x=>x.tipo==="TFR")))}</td><td>${eur0.format(sum(my.filter(x=>x.tipo==="Personale"||x.tipo==="Datore")))}</td><td>${spY?"−"+eur0.format(spY):"—"}</td><td>${lastV==null?"—":eur0.format(lastV)}</td></tr>`;}).join("")}</table></div>`;
}
function chartOpts(){
  if(window.Chart){ Chart.defaults.font.family = 'Geist, system-ui, sans-serif'; Chart.defaults.font.size = 11; }
  return {responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{position:"bottom",labels:{boxWidth:12,usePointStyle:true,color:css("--muted")}},
      tooltip:{callbacks:{label:ctx=>`${ctx.dataset.label}: ${eur.format(ctx.parsed.y)}`}}},
    scales:{x:{grid:{display:false},ticks:{color:css("--muted"),maxRotation:0,autoSkip:true}},
      y:{grid:{color:css("--line")},ticks:{color:css("--muted"),callback:v=>eur0.format(v)}}}};
}
function histChart(){
  if(!window.Chart) return;
  const v = vals(); if(!v.length) return;
  let pts;
  if(S.fund==="__all" && (S.cfg.fondi||[]).length>1){
    const dates=[...new Set(v.map(x=>x.data))].sort(), last={};
    pts = dates.map(d=>{ v.filter(x=>x.data===d).forEach(x=>last[x.fondo]=x);
      const parts=Object.values(last); return {d, val:parts.reduce((s,x)=>s+x.valore,0), acc:parts.reduce((s,x)=>s+accreditatoAl(x.data,x.fondo),0)}; });
  } else pts = v.map(x=>({d:x.data,val:x.valore,acc:accreditatoAl(x.data)}));
  S.charts.hist = new Chart($("#cHist"),{type:"line",data:{labels:pts.map(p=>fd(p.d).slice(3)),datasets:[
    {label:"Valore",data:pts.map(p=>p.val),borderColor:css("--accent"),backgroundColor:css("--accent"),tension:.25,borderWidth:2.5,pointRadius:4},
    {label:"Versato",data:pts.map(p=>p.acc),borderColor:css("--blue"),backgroundColor:css("--blue"),stepped:false,tension:.25,borderWidth:1.5,borderDash:[5,4],pointRadius:3}
  ]},options:chartOpts()});
}
function project(start, tfr, per, r, g, years){
  const rm = Math.pow(1+r,1/12)-1; let v=start, c=0; const series=[{y:new Date().getFullYear(),v,c}];
  let mt=tfr, mp=per;
  for(let y=1;y<=years;y++){
    for(let m=0;m<12;m++){ v = v*(1+rm) + mt + mp; c += mt+mp; }
    series.push({y:new Date().getFullYear()+y, v, c:c}); mt*=1+g; mp*=1+g;
  }
  series.forEach(p=>p.c+=start);
  return {end:v, contrib:c, series};
}

// ---------- forms ----------
const dlg = $("#dlg"), form = $("#dlgForm");
function openForm(html, onSubmit, onDelete){
  form.innerHTML = `<button type="button" class="iconbtn dclose" id="fX" aria-label="Chiudi"><svg class="ic"><use href="#i-x"/></svg></button>` + html + `<div class="actions">${onDelete?`<button type="button" class="btn danger" id="fDel">Elimina</button>`:""}<span class="sp"></span>
    <button type="button" class="btn ghost" id="fCancel">Annulla</button><button type="submit" class="btn" id="fOk">Salva</button></div>`;
  form.onsubmit = async e => { e.preventDefault(); const ok=$("#fOk"); ok.disabled=true;
    try{ const r = await onSubmit(new FormData(form)); if(r!==false){ dlg.close(); } }catch(err){ toast("Non salvato: "+(err&&err.code||err.message||"errore")); }
    ok.disabled=false; };
  $("#fCancel").onclick = ()=>dlg.close(); $("#fX").onclick = ()=>dlg.close();
  dlg.onclick = e => { if(e.target===dlg) dlg.close(); };
  if(onDelete) $("#fDel").onclick = async ()=>{ const b=$("#fDel"); if(b.dataset.c!=="1"){ b.dataset.c="1"; b.textContent="Conferma eliminazione"; return; }
    try{ await onDelete(); dlg.close(); toast("Eliminato"); }catch(err){ toast("Non eliminato"); } };
  dlg.showModal();
}
function fundField(cur){
  const f = S.cfg.fondi||[]; if(f.length<=1) return `<input type="hidden" name="fondo" value="${esc(cur||f[0]||"")}">`;
  return `<label class="f"><span>Fondo</span><select name="fondo">${f.map(x=>`<option ${x===(cur||(S.fund!=="__all"?S.fund:f[0]))?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
}
const dec = v => v===""||v==null ? "" : String(v).replace(".",",");
const r2 = x => Math.round(x*100)/100;
function chooser(){
  if(!guard()) return;
  form.innerHTML = `<button type="button" class="iconbtn dclose" id="fX" aria-label="Chiudi"><svg class="ic"><use href="#i-x"/></svg></button>
    <h3>Cosa registri?</h3>
    <div class="choices">
      <button type="button" data-c="tfr"><span class="gicon am"><svg class="ic"><use href="#i-hourglass-medium"/></svg></span><div><b>TFR in busta paga</b><span>La quota maturata questo mese</span></div></button>
      <button type="button" data-c="mov"><span class="gicon or"><svg class="ic"><use href="#i-coins"/></svg></span><div><b>Versamento sul fondo</b><span>TFR, contributo personale o del datore, spesa</span></div></button>
      <button type="button" data-c="val"><span class="gicon "><svg class="ic"><use href="#i-chart-line-up"/></svg></span><div><b>Estratto conto</b><span>Il valore aggiornato della posizione</span></div></button>
    </div>`;
  form.onsubmit = e => e.preventDefault();
  $("#fX").onclick = ()=>dlg.close();
  dlg.onclick = e => { if(e.target===dlg) dlg.close(); };
  form.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ dlg.close(); const c=b.dataset.c; setTimeout(()=> c==="tfr"?editTfr(): c==="mov"?editMov(): editVal(), 0); });
  dlg.showModal();
}
function editTfr(t){
  if(!guard()) return;
  const isNew=!t; t = t || {competenza:prevMonth(), data:today(), importo:"", note:"", versamento:null};
  const v = t.versamento ? S.mov.find(m=>m.id===t.versamento) : null;
  openForm(`<h3>${isNew?"TFR in busta paga":"TFR "+esc(tfrLabel(t))}</h3>
    ${fundField(t.fondo)}
    <div class="grid2">
      <label class="f"><span>Mese di competenza</span><input type="month" name="competenza" required value="${t.competenza||""}"></label>
      <label class="f"><span>Importo €</span><input name="importo" inputmode="decimal" required placeholder="${avgTFR()?dec(avgTFR().toFixed(2)):""}" value="${dec(t.importo)}"></label>
    </div>
    <label class="f"><span>Data busta paga</span><input type="date" name="data" required value="${t.data||""}"></label>
    <label class="f"><span>Nota</span><input name="note" placeholder="es. tredicesima" value="${esc(t.note||"")}"></label>
    <div class="formnote">${v?`Versato sul fondo il ${fd(v.data)}. Per scollegarlo modifica quel versamento.`:`Resta "da versare" finché non lo includi in un versamento TFR.`}</div>`,
  async fd => {
    const imp = num(fd.get("importo")); if(!imp){ toast("Importo mancante"); return false; }
    await save("tfr", t.id, {fondo: fd.get("fondo")||S.cfg.fondi[0], competenza: fd.get("competenza"), data: fd.get("data"), importo: r2(imp), note: fd.get("note")||"", versamento: t.versamento||null});
    toast("Salvato");
  }, isNew?null:async()=>{ if(t.versamento){ toast("È in un versamento: scollegalo prima"); throw new Error("linked"); } await del("tfr",t.id); });
}
async function linkTfr(movId, ids){
  // collega i mesi scelti al versamento e scollega quelli tolti; una scrittura per documento
  for(const t of S.tfr){
    const want = ids.includes(t.id) ? movId : (t.versamento===movId ? null : t.versamento);
    if((t.versamento||null)!==(want||null)){ const {id,...rest}=t; await S.db.collection("tfr").doc(id).set({...rest, versamento: want}); }
  }
}
function editMov(m, tipoDefault){
  if(!guard()) return;
  const isNew = !m; m = m || {tipo: tipoDefault||"TFR", data:today(), importo:"", note:""};
  const avail = () => S.tfr.filter(t=>(!t.versamento || t.versamento===m.id) && t.fondo===(form.elements.fondo?.value||m.fondo||S.cfg.fondi[0]))
    .sort((a,b)=>(a.competenza||a.data).localeCompare(b.competenza||b.data));
  openForm(`<h3>${isNew?"Nuovo versamento":"Versamento del "+fd(m.data)}</h3>
    ${fundField(m.fondo)}
    <label class="f"><span>Tipo</span><select name="tipo" id="mTipo">${Object.entries(TIPI).map(([k,v])=>`<option value="${k}" ${m.tipo===k?"selected":""}>${k==="Spesa"?"Spesa del piano":k==="TFR"?"TFR versato":"Contributo "+v.l.toLowerCase()}</option>`).join("")}</select></label>
    <div id="tfrPick"></div>
    <div class="grid2">
      <label class="f"><span id="mDataL">Data sul fondo</span><input type="date" name="data" required value="${m.data||""}"></label>
      <label class="f"><span>Importo €</span><input name="importo" id="mImp" inputmode="decimal" required value="${dec(m.importo)}"></label>
    </div>
    <label class="f"><span>Nota</span><input name="note" id="mNote" value="${esc(m.note||"")}"></label>`,
  async fd => {
    const imp = num(fd.get("importo")); if(!imp){ toast("Importo mancante"); return false; }
    const tipo = fd.get("tipo");
    const body = {fondo: fd.get("fondo")||S.cfg.fondi[0], tipo, data: fd.get("data"), importo: r2(Math.abs(imp)), note: fd.get("note")||""};
    const ref = m.id ? S.db.collection("movimenti").doc(m.id) : S.db.collection("movimenti").doc();
    await ref.set(body);
    const ids = tipo==="TFR" ? fd.getAll("tfr") : [];
    await linkTfr(ref.id, ids);
    toast(ids.length?`Salvato · ${ids.length} mesi di TFR collegati`:"Salvato");
  }, isNew?null:async()=>{ await del("movimenti",m.id); await linkTfr(m.id, []); });
  const pick = $("#tfrPick"), imp = $("#mImp");
  let touched = !isNew;
  imp.addEventListener("input", ()=>touched=true);
  const recalc = () => { const ids=[...form.querySelectorAll('input[name=tfr]:checked')].map(x=>x.value);
    const tot = sum(S.tfr.filter(t=>ids.includes(t.id)));
    $("#pickTot") && ($("#pickTot").textContent = eur.format(tot));
    if(!touched || !imp.value) { imp.value = tot ? dec(tot.toFixed(2)) : ""; touched=false; } };
  const sync = () => {
    const t = $("#mTipo").value;
    $("#mNote").placeholder = t==="Spesa" ? "es. quota associativa annua" : "";
    if(t!=="TFR"){ pick.innerHTML=""; return; }
    const list = avail();
    pick.innerHTML = list.length ? `<div class="pick"><div class="pickhead"><span>Mesi di TFR inclusi</span><b id="pickTot"></b></div>
      ${list.map(x=>`<label class="pickrow"><input type="checkbox" name="tfr" value="${x.id}" ${(x.versamento===m.id && m.id) || (isNew && !x.versamento) ? "checked":""}>
        <span>${esc(tfrLabel(x))}</span><b>${eur.format(x.importo)}</b></label>`).join("")}</div>`
      : `<div class="formnote">Nessun TFR da versare. Registra prima il TFR delle buste paga.</div>`;
    pick.querySelectorAll("input").forEach(c=>c.onchange=()=>{ touched=false; recalc(); });
    recalc();
  };
  $("#mTipo").onchange=sync; if(form.elements.fondo.tagName==="SELECT") form.elements.fondo.addEventListener("change",sync); sync();
}
function prevMonth(){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1); return d.toISOString().slice(0,7); }
function editVal(v){
  if(!guard()) return;
  const isNew=!v; v = v || {data:today(), valore:"", note:""};
  openForm(`<h3>${isNew?"Estratto conto":"Estratto del "+fd(v.data)}</h3>
    ${fundField(v.fondo)}
    <div class="grid2">
      <label class="f"><span>Data estratto conto</span><input type="date" name="data" required value="${v.data}"></label>
      <label class="f"><span>Valore della posizione €</span><input name="valore" inputmode="decimal" required value="${dec(v.valore)}"></label>
    </div>
    <label class="f"><span>Nota</span><input name="note" value="${esc(v.note||"")}"></label>
    ${isNew?`<label class="f check" id="mkWrap" hidden><input type="checkbox" name="mk" checked><span id="mkTxt"></span></label>`:""}`,
  async fd => {
    const val = num(fd.get("valore")); if(!val){ toast("Valore mancante"); return false; }
    const body = {fondo: fd.get("fondo")||S.cfg.fondi[0], data: fd.get("data"), valore: r2(val), note: fd.get("note")||""};
    await save("valorizzazioni", v.id, body);
    if(isNew && fd.get("mk")){
      const list = pendingTfr(body.fondo).filter(t=>t.data<=body.data);
      if(list.length){ const ref=S.db.collection("movimenti").doc();
        await ref.set({fondo:body.fondo, tipo:"TFR", data:body.data, importo:r2(sum(list)), note:""});
        await linkTfr(ref.id, list.map(t=>t.id)); toast(`Salvato · versamento TFR di ${eur.format(sum(list))} creato`); return; }
    }
    toast("Salvato");
  }, isNew?null:()=>del("valorizzazioni",v.id));
  const w=$("#mkWrap");
  if(w){ const upd=()=>{ const l=pendingTfr(form.elements.fondo.value).filter(t=>t.data<=form.elements.data.value);
      w.hidden=!l.length; $("#mkTxt").textContent=`Registra anche il versamento TFR dei ${l.length} mesi da versare (${eur.format(sum(l))}), con la data dell'estratto`; };
    form.elements.data.addEventListener("input",upd); if(form.elements.fondo.tagName==="SELECT") form.elements.fondo.addEventListener("change",upd); upd(); }
}

// ---------- export ----------
async function offer(filename, text, mime){
  try{ const dl = await claude.use("downloads");
    if(dl){ await dl.save({filename, data:new Blob([text],{type:mime})}); return; } }catch(e){ if(e && e.code && /declin|cancel/i.test(e.code)) return; }
  try{ await navigator.clipboard.writeText(text); toast("Copiato negli appunti"); }catch(e){ toast("Download non disponibile"); }
}
function exportCSV(){
  const q = s => `"${String(s??"").replace(/"/g,'""')}"`;
  const rows = [["archivio","fondo","tipo","data","competenza","importo","collegato_a","note"].join(";")];
  S.tfr.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(t=>rows.push(["tfr_accumulato",t.fondo,"TFR",t.data,t.competenza||"",dec(t.importo),t.versamento||"",t.note].map(q).join(";")));
  S.mov.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(m=>rows.push(["versamento:"+m.id,m.fondo,m.tipo,m.data,"",dec(m.importo),"",m.note].map(q).join(";")));
  S.val.slice().sort((a,b)=>a.data.localeCompare(b.data)).forEach(v=>rows.push(["estratto_conto",v.fondo,"",v.data,"",dec(v.valore),"",v.note].map(q).join(";")));
  offer(`piano-pensione-${today()}.csv`, "﻿"+rows.join("\n"), "text/csv");
}
function exportJSON(){
  offer(`piano-pensione-${today()}.json`, JSON.stringify({esportato:today(), impostazioni:S.cfg, tfr_accumulato:S.tfr, versamenti:S.mov, estratti_conto:S.val},null,2), "application/json");
}

// ---------- boot ----------
renderFunds();
const h = location.hash.slice(1); if(h && VIEWS[h]) S.view = h;
document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
render();
(function wait(n){ if(window.claude && window.claude.use) initDb(); else if(n>0) setTimeout(()=>wait(n-1),200); else setStatus("Archivio non disponibile in questa vista"); })(25);
})();
</script>
